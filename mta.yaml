_schema-version: '3.1'
ID: cnma_proresolve
version: 0.0.1
description: CNMA Proresolve Multi-Target Application
parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm install
        # `npm run build` chứ không phải `cds build` trực tiếp: bước
        # bundle:library phải chạy trước để gói case sạch vào
        # srv/data/case-library/, nơi app đọc lúc khởi động để tự nạp kho.
        - npm run build

modules:
  # --------------------- SERVER MODULE ---------------------
  - name: cnma_proresolve_srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules
        - default-env.json
        - mta_archives
        - db/node_modules
        - app/node_modules
        - app/dist
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: cnma_proresolve_db
      - name: cnma_proresolve_xsuaa
      # CDK đọc destination `AICORE` qua VCAP_SERVICES.destination của CHÍNH app
      # này. Không bind ở đây thì nó rơi về credential trong biến môi trường,
      # mà trên CF không có, nên mọi lời gọi model hỏng:
      #     Destination service not bound. Run with --profile hybrid…
      # Bind cho approuter là chưa đủ — approuter không gọi model.
      - name: cnma_proresolve_destination

  # ------------------- DATABASE DEPLOYER -------------------
  - name: cnma_proresolve_db_deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules
        - default-env.json
        # HDI cố dịch MỌI file trong `src/` thành một artifact. `.gitkeep` là
        # file giữ chỗ cho git, không có plugin nào nhận nó, nên `hdi-deploy`
        # dừng cả lượt:
        #     "src/.gitkeep": could not create a compile unit for the file
        #     Could not find a ".hdiconfig" file in "src" or in any parent folder
        - "**/.gitkeep"
    requires:
      - name: cnma_proresolve_db

  # -------------------- APPROUTER MODULE -------------------
  - name: cnma_proresolve_approuter
    type: approuter.nodejs
    path: app/approuter
    parameters:
      disk-quota: 512M
      memory: 256M
    build-parameters:
      builder: custom
      commands: []
      ignore:
        - node_modules
        - default-env.json
    requires:
      # Phải là plan `app-runtime`, KHÔNG phải `app-host`.
      #
      # `app-host` là nơi CHỨA nội dung UI (module ui_deployer đẩy lên đó);
      # credential của nó không có `grant_type`, nên approuter crash ngay lúc
      # khởi động:
      #     html5-repo-credentials: Missing required property: grant_type
      # `app-runtime` mới là plan cấp credential để ĐỌC nội dung lúc chạy.
      - name: cnma_proresolve_html5_runtime
      - name: cnma_proresolve_xsuaa
      - name: cnma_proresolve_destination
      - name: srv-api
        group: destinations
        properties:
          name: cnma_proresolve-srv-api
          url: '~{srv-url}'
          forwardAuthToken: true

  # ----------------------- UI MODULE -----------------------
  - name: cnma_proresolve_ui
    type: html5
    path: app/cnma_proresolve_ui
    build-parameters:
      ignore:
        - .dev
        - node_modules
        - default-env.json
      build-result: dist
      builder: custom
      commands:
        - npm install
        - npm run build:cf
      supported-platforms: []

  # -------------------- UI DEPLOYER ------------------------
  - name: cnma_proresolve_ui_deployer
    type: com.sap.application.content
    path: .
    requires:
      - name: cnma_proresolve_html5_host
        parameters:
          content-target: true
    build-parameters:
      ignore:
        - node_modules
        - default-env.json
        - gen
        - app
        - srv
        - db
        - mta_archives
        - .agent
        - .claude
      build-result: ui_resources
      requires:
        - artifacts:
            - cnma_proresolve_ui.zip
          name: cnma_proresolve_ui
          target-path: ui_resources/

  # ---------------- DESTINATION CONTENT --------------------
  - name: cnma_proresolve_destination_content
    type: com.sap.application.content
    requires:
      - name: cnma_proresolve_xsuaa
        parameters:
          service-key:
            name: cnma_proresolve_xsuaa_key
      - name: cnma_proresolve_html5_host
        parameters:
          service-key:
            name: cnma_proresolve_html5_host_key
      - name: cnma_proresolve_destination
        parameters:
          content-target: true
    build-parameters:
      no-source: true
    parameters:
      content:
        instance:
          existing_destinations_policy: update
          destinations:
            - Name: cnma_proresolve_html5_dest
              ServiceInstanceName: cnma_proresolve_html5_host
              ServiceKeyName: cnma_proresolve_html5_host_key
              sap.cloud.service: cnma.proresolve
            - Name: cnma_proresolve_xsuaa_dest
              Authentication: OAuth2UserTokenExchange
              ServiceInstanceName: cnma_proresolve_xsuaa
              ServiceKeyName: cnma_proresolve_xsuaa_key
              sap.cloud.service: cnma.proresolve

resources:
  # ------------------ HDI CONTAINER DB ---------------------
  #
  # `com.sap.xs.hdi-container` với plan `hdi-shared` là dạng duy nhất chạy được
  # ở đây. Khai báo cũ là `com.sap.hana.ondemand-service` + plan `hdb`, và
  # MultiApps từ chối ngay ở bước merge descriptor:
  #     Unsupported resource type "com.sap.hana.ondemand-service"
  #     for platform type "CLOUD-FOUNDRY"
  # Subaccount này cũng chỉ được entitle plan `hdi-shared` (xem `cf marketplace
  # -e hana`) — `hdb` là plan cấp cả một HANA instance, không phải container.
  - name: cnma_proresolve_db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  # ----------------------- XSUAA ---------------------------
  - name: cnma_proresolve_xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      config:
        tenant-mode: dedicated
        xsappname: cnma_proresolve-${space}
      path: ./xs-security.json
      service: xsuaa
      service-plan: application

  # ----------------- HTML5 APPS REPO HOST ------------------
  # Nơi CHỨA nội dung UI. `ui_deployer` đẩy bundle lên đây.
  - name: cnma_proresolve_html5_host
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-host

  # ---------------- HTML5 APPS REPO RUNTIME ----------------
  # Nơi ĐỌC nội dung lúc chạy. Approuter bind vào cái này.
  # Hai plan là hai vai trò khác nhau, không thay thế cho nhau được.
  - name: cnma_proresolve_html5_runtime
    type: org.cloudfoundry.managed-service
    parameters:
      service: html5-apps-repo
      service-plan: app-runtime

  # ------------------ DESTINATION SERVICE -------------------
  - name: cnma_proresolve_destination
    type: org.cloudfoundry.managed-service
    # `init_data` bên dưới tham chiếu `~{srv-api/srv-url}`, nên resource này
    # BẮT BUỘC phải khai phụ thuộc vào `srv-api`. Thiếu nó thì MultiApps dừng ở
    # bước resolve descriptor:
    #     Module/Resource "cnma_proresolve_destination" does not contain a
    #     required dependency for "srv-api", but contains references to its
    #     properties
    requires:
      - name: srv-api
    parameters:
      service: destination
      service-plan: lite
      config:
        HTML5Runtime_enabled: true
        init_data:
          instance:
            existing_destinations_policy: ignore
            destinations:
              - Name: cnma_proresolve-srv-api
                Description: CNMA Proresolve Backend API
                Authentication: NoAuthentication
                ProxyType: Internet
                Type: HTTP
                URL: ~{srv-api/srv-url}
                HTML5.DynamicDestination: true
                HTML5.ForwardAuthToken: true
                # Mặc định của HTML5 runtime là 30 giây, mà `analyzeFromJson`
                # chạy 60-90 giây. Không nâng thì UI nhận timeout trong khi
                # pipeline vẫn đang chạy bình thường ở backend.
                HTML5.Timeout: 600000
